name: Update market dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify parsers
        run: node --test collect.test.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Collect public quotes
        env:
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/quotes.json
        run: node collect.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
